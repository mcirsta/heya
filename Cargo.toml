[package]
name = "heya"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.99"
publish = false
description = "A native WhatsApp desktop client built with Rust and Slint"

[features]
default = ["media-gstreamer"]
media-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

[dependencies]
async-channel = "2"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
emojis = "0.9"
unicode-segmentation = "=1.13.3"
# Development snapshot for native Wayland drops. The native accessibility bridge
# is disabled in this upstream branch; restore it when Slint supports winit 0.31.
slint = { git = "https://github.com/slint-ui/slint", rev = "a5a124bf80961966e875dc91d8d04271ec5885d8", default-features = false, features = ["std", "backend-winit", "accessibility", "compat-1-18", "unstable-winit-031"] }
# Version-specific input bridges: wheel phases in presentation_scroll and
# undoable paste commits in presentation_clipboard (missing public APIs).
i-slint-core = { git = "https://github.com/slint-ui/slint", rev = "a5a124bf80961966e875dc91d8d04271ec5885d8", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs"] }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "voip"] }
rusqlite = "0.40"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
webbrowser = "=1.2.4"
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
directories = "6"
getrandom = "0.3"
qrcodegen = "1.8"
zeroize = "1"
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
hkdf = "0.12"
futures-util = "0.3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
# Use the application's runtime, including for the long-lived launcher badge.
# The default async-io backend otherwise starts a connection executor thread.
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# Preserve the existing Linux renderer selection.
slint = { git = "https://github.com/slint-ui/slint", rev = "a5a124bf80961966e875dc91d8d04271ec5885d8", default-features = false, features = ["renderer-software", "renderer-skia-vulkan", "renderer-skia-opengl"] }

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
keyring = { version = "3.6", features = ["apple-native"] }
ogg = "0.9"
# Skia's platform renderer uses Metal on macOS.
slint = { git = "https://github.com/slint-ui/slint", rev = "a5a124bf80961966e875dc91d8d04271ec5885d8", default-features = false, features = ["renderer-skia"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "a5a124bf80961966e875dc91d8d04271ec5885d8" }

[dev-dependencies]
flate2 = "1"
i-slint-backend-testing = { git = "https://github.com/slint-ui/slint", rev = "a5a124bf80961966e875dc91d8d04271ec5885d8" }

i-slint-renderer-skia = { git = "https://github.com/slint-ui/slint", rev = "a5a124bf80961966e875dc91d8d04271ec5885d8" }

[profile.dev]
debug = 1
# Generated Slint bindings otherwise accumulate very large incremental caches.
incremental = false

[profile.test]
incremental = false

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
# Slint's generated bindings contain narrowly scoped unsafe code.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

# One additive media-type patch, based on the same pinned SDK revision.
# All other SDK crates still come from the Git dependency above.
[patch."https://github.com/oxidezap/whatsapp-rust"]
wacore = { path = "vendor/wacore" }

# Slint text shaping: prefer platform color emoji before monochrome text fallbacks.
# Exact base and minimal diff: docs/color-emoji.md, patches/parley-color-emoji.patch.
[patch.crates-io]
# Standard Linux file-list framing; see patches/arboard-uri-list.patch.
arboard = { path = "vendor/arboard" }
parley = { path = "vendor/parley" }
# Pinned text-coverage and opacity-layer patches; see patches/README.md.
[patch."https://github.com/slint-ui/slint"]
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
