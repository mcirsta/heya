[package]
name = "heya"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "A native WhatsApp desktop client built with Rust and Slint"

[features]
default = ["media-gstreamer"]
media-gstreamer = ["dep:gstreamer", "dep:gstreamer-app"]

[dependencies]
emojis = "0.9"
unicode-segmentation = "=1.13.3"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18", "unstable-winit-030"] }
# Isolated in presentation_scroll: retain the wheel gesture phase, which the
# public PointerScrolled event cannot carry in this exact Slint release.
i-slint-core = { version = "=1.18.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
webbrowser = "=1.2.4"
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
directories = "6"
getrandom = "0.3"
qrcodegen = "1.8"
zeroize = "1"
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
hkdf = "0.12"
futures-util = "0.3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
zbus = "=5.19.0"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Preserve the existing Linux renderer selection.
slint = { version = "=1.18.1", default-features = false, features = ["renderer-skia-vulkan", "renderer-skia-opengl"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# Skia's platform renderer uses Metal on macOS.
slint = { version = "=1.18.1", default-features = false, features = ["renderer-skia"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
flate2 = "1"
i-slint-backend-testing = "=1.18.1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
# Slint's generated bindings contain narrowly scoped unsafe code.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

# One additive media-type patch, based on the same pinned SDK revision.
# All other SDK crates still come from the Git dependency above.
[patch."https://github.com/oxidezap/whatsapp-rust"]
wacore = { path = "vendor/wacore" }

# Slint text shaping: prefer platform color emoji before monochrome text fallbacks.
# Exact base and minimal diff: docs/color-emoji.md, patches/parley-color-emoji.patch.
[patch.crates-io]
parley = { path = "vendor/parley" }
