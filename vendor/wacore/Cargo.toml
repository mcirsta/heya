# Generated by scripts/vendor-document-preview.py; see patches/README.md.
[package]
name = "wacore"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/oxidezap/whatsapp-rust"
description = "Core WhatsApp protocol implementation without runtime dependencies"
# Only the explicit [[bench]] targets below are built; never auto-discover benches/*.rs, so a stray
# untracked file on a reused CI runner can't get compiled as a phantom bench.
autobenches = false

# `getrandom` is pulled only to forward the `js` feature (wasm getrandom backend);
# there is no direct `use`, so static analysers flag it as unused.
[package.metadata.cargo-machete]
ignored = ["getrandom"]

[features]
debug-snapshots = []
# Typed interop with the decoded libsignal SessionRecord v1 model.
legacy-session-interop = ["wacore-libsignal/legacy-session-interop"]
# Shared cryptographic fixtures and InMemoryBackend fault-injection/call-count
# hooks for tests. Off by default so normal builds carry no test scaffolding
# or per-call bookkeeping.
test-util = []
# Optional observability: emit tracing spans/events. Off by default (no dep).
tracing = ["dep:tracing"]
# Optional metrics via the `metrics` facade. Off by default (no dep).
metrics = ["dep:metrics"]
# Render raw phone numbers in tracing fields instead of redacted tokens (debug only).
tracing-pii = ["wacore-binary/tracing-pii"]
# Enable JS-based random number generation for wasm32 targets.
# Activates getrandom's wasm_js backend so rand works in the browser.
js = ["getrandom/wasm_js"]
# The neutral control-plane media contract: the boundary types and the backend/session traits a
# media engine implements, with no `voip` type in the API. It carries no engine, no crypto and no
# codec, so a build that enables it and not `voip` compiles the control plane without the engine.
# `voip` implies it, because the registry stores a session behind this contract.
voip-control = []
# VoIP/calls media crypto (SRTP, SFrame, WAHKDF). Pure, no-Tokio. Off by default.
voip = ["voip-control", "dep:aes-gcm", "dep:zerocopy"]
# Built-in PCM/MLOW adapter. Encoded audio transport needs only `voip`.
voip-mlow = ["voip"]
# Heap profiling of the codec hot paths via the `voip_profile` example (dhat as global allocator).
# Dev/profiling only; off by default and not pulled into normal builds.
dhat-heap = ["dep:dhat"]
# Per-stage MLow codec bench surface (`voip::mlow::stage_bench`), so `voip_benchmark` can attribute
# encoder CPU to a stage. Pure bench scaffolding: `#[doc(hidden)]` would hide it from rustdoc but
# still compile it into every consumer, so it is a feature. Dev/bench only; off by default.
bench-internals = []

[dependencies]
aes = { version = "0.9.2" }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"], optional = true }
anyhow = { version = "1.0", default-features = false }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
async-lock = { version = "3", default-features = false }
async-trait = { version = "0.1.91" }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bon = { version = "3.9.3", default-features = false, features = ["std"] }
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
bytes = { version = "1.12", default-features = false }
# Media upload/download run AES-256-CBC incrementally over a stream, which the
# mode's own batch loop does with the chaining block in a register.
cbc = { version = "0.2", features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
compact_str = { version = "0.10", default-features = false }
ctr = { version = "0.10", default-features = false }
dhat = { version = "0.3", optional = true }
event-listener = { version = "5", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await", "std"] }
getrandom = { version = "0.4", default-features = false, optional = true }
hashbrown = { version = "0.17.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
itoa = { version = "1" }
log = { version = "0.4" }
metrics = { version = "0.24", optional = true }
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
rand = { version = "0.10" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde-big-array = { version = "0.5" }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
# `serde` for the inline reporting-token buffers on `MsgMetaInfo`, which the
# `Serialize` derive on `MessageInfo` reaches through.
smallvec = { version = "1.15", features = ["serde"] }
smoothutf8 = { version = "0.2.3", default-features = false }
subtle = { version = "2.6", default-features = false }
thiserror = { version = "2.0.19" }
# Parse media references without losing signed query parameters or the route origin.
fluent-uri = { version = "0.4.1", default-features = false, features = ["alloc"] }
tracing = { version = "0.1", default-features = false, features = ["attributes"], optional = true }
wacore-appstate = { default-features = false, version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
wacore-binary = { default-features = false, version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95", features = ["serde"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
wacore-derive = { version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
wacore-libsignal = { version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
wacore-noise = { version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
waproto = { version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
zerocopy = { version = "0.8.55", default-features = false, features = ["derive"], optional = true }

[build-dependencies]
buffa-build = { version = "0.9.2", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
# Differential oracle only; IDNA/ICU must not enter the media runtime.
url = { version = "2.5.8", default-features = false }
# Compact oracle fixtures; pure Rust, test-only, including on wasm targets.
ciborium = "0.2.2"
ruzstd = "0.9.0"
divan = { package = "codspeed-divan-compat", version = "=5.0.2" }
# Compression only: the runtime inflates through `wacore_binary::zlib_pool`
# (zlib-rs directly), so flate2 stays out of the release dependency set.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await", "executor"] }
# `rt-multi-thread` is test-only: the wire-gate race test needs two threads to
# actually interleave a lease insert with the lock-free gate query.
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Keep this path-only: package normalization must omit the local self edge.
wacore = { path = ".", default-features = false, features = ["bench-internals"] }

[[bench]]
name = "reporting_token_benchmark"
harness = false

[[bench]]
name = "send_receive_benchmark"
harness = false

[[bench]]
name = "message_metadata_benchmark"
harness = false

[[bench]]
name = "token_lookup_benchmark"
harness = false

[[bench]]
name = "signal_address_probe_benchmark"
harness = false

[[bench]]
name = "history_sync_benchmark"
harness = false

[[bench]]
name = "sframe_varint_benchmark"
harness = false
required-features = ["voip"]

[[bench]]
name = "message_utils_benchmark"
harness = false

[[bench]]
name = "appstate_sync_benchmark"
harness = false

[[bench]]
name = "sender_key_derivation_benchmark"
harness = false

[[bench]]
name = "prekey_store_benchmark"
harness = false

[[bench]]
name = "media_benchmark"
harness = false

[[bench]]
name = "retained_memory_benchmark"
harness = false

[[bench]]
name = "voip_benchmark"
harness = false
# Only `voip-mlow` here on purpose: cargo SILENTLY SKIPS a bench target whose required features are
# off, so listing `bench-internals` too would make the previously-working
# `cargo bench --features voip-mlow --bench voip_benchmark` quietly run nothing -- dropping the MLow,
# SRTP, SFrame and framing rows along with the stage rows. The `codec_stages` module is `#[cfg]`-gated
# inside the bench instead, so it is the only part that needs the extra feature.
required-features = ["voip-mlow"]

[[example]]
name = "voip_profile"
required-features = ["voip-mlow"]

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unused_qualifications = "warn"
