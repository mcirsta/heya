# Generated by scripts/vendor-video-preview.py; see patches/README.md.

[package]
name = "whatsapp-rust"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/oxidezap/whatsapp-rust"
readme = "README.md"
description = "Rust client for WhatsApp Web"
# Only the explicit [[bench]] targets below are built; never auto-discover
# benches/*.rs, so a stray untracked file on a reused CI runner can't get
# compiled as a phantom bench. Same rationale as wacore.
autobenches = false

[package.metadata.docs.rs]
features = ["passkey", "plugins"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
debug-snapshots = ["wacore/debug-snapshots"]
# Typed interop with the decoded legacy SessionRecord v1 model, for migrating
# externally produced auth state. Off by default so native clients carry no
# migration surface.
legacy-session-interop = ["wacore/legacy-session-interop"]
# Generation-scoped extension lifecycle. Kept opt-in so ordinary clients do not
# retain lifecycle state or branches when no extension host is present.
client-lifecycle = []
# Build-time native plugin host. Kept opt-in so clients that do not use plugins
# retain the pre-host binary footprint.
plugins = ["client-lifecycle"]
# SHORTCAKE_PASSKEY linking flow. Opt-in so a client that links by QR or pair
# code carries neither the flow nor any state for it; the core keeps no field
# and no branch either way. See agent_docs/architecture.md.
passkey = []
# Optional observability. Off by default: no `tracing` dep, zero overhead.
# Emits tracing spans/events only; the application installs the subscriber
# (and any OpenTelemetry bridge). See examples/observability.rs.
tracing = ["dep:tracing", "wacore/tracing"]
# Optional metrics (counters/histograms/gauges via the `metrics` facade). Off by
# default: no dependency, zero overhead. Emits only; the application installs a
# recorder (e.g. metrics-exporter-prometheus). See examples/metrics.rs.
metrics = ["wacore/metrics"]
# Render raw phone numbers in tracing fields instead of the redacted `pn#<hash>`.
# Local debugging only; never enable in production.
tracing-pii = ["wacore/tracing-pii", "wacore-binary/tracing-pii"]
# Native fixtures for the client-level benchmarks (`benches/`). Not a public
# API: the module it enables is `#[doc(hidden)]` and exists only so a bench
# target, which links the crate from outside, can reach the crate-private send
# internals it measures. Never enable it in a shipping build.
bench-harness = ["tokio-runtime", "tokio/rt-multi-thread", "dep:wacore-noise", "wacore-noise/test-util"]
# Native integration fixtures only. Never enable in a shipping dependency.
test-support = ["voip-runtime", "tokio-runtime", "dep:wacore-noise", "wacore-noise/test-util"]
danger-skip-tls-verify = ["whatsapp-rust-tokio-transport?/danger-skip-tls-verify"]
default = [
    "sqlite-storage",
    "sqlite-storage-bundled",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "tokio-native",
    "signal",
]
ureq-client = ["dep:whatsapp-rust-ureq-http-client"]
tokio-transport = ["dep:whatsapp-rust-tokio-transport"]
tokio-runtime = ["dep:tokio"]
signal = ["tokio-runtime", "tokio/signal"]
sqlite-storage = ["whatsapp-rust-sqlite-storage"]
sqlite-storage-bundled = ["sqlite-storage", "whatsapp-rust-sqlite-storage/bundled-sqlite"]
tokio-native = ["tokio-runtime", "tokio/rt-multi-thread"]
# The portable half of the VoIP runtime: call signaling, the facade, and the orchestration around
# `wacore`'s sans-IO engine. It owns no socket and names no clock, so it builds wherever `wacore`
# does -- wasm32 included. What it does NOT bring is a way onto the wire; see `voip-relay-native`.
#
# It does not pull `tokio-runtime` either. The executor a call is driven on is the client's own
# `Arc<dyn Runtime>`, and the only thing in this half that ever named Tokio was one `run_call_tokio`
# call in the facade -- every clock and every timeout already went through `wacore::runtime`. A
# native build gets `tokio-runtime` back through `voip-relay-native`, which genuinely needs it.
voip-runtime = ["voip-control", "voip-engine-wacore"]
# The neutral control-plane media contract, re-exported from `wacore::voip_control` as
# `whatsapp_rust::voip_control`. Its API names no `wacore::voip` type, so this feature compiles with
# the engine off. It is the boundary a media backend implements; it carries no backend itself.
#
# This feature carries the call flow, not only the contract: `src/voip` (the facade, the registry,
# the signaling state) and `src/client/voip.rs` are gated on it, and they compile with the engine
# off by naming the neutral `wacore::voip_control` types. The resident engine backend below is the
# only part that turns `wacore/voip` on. Starting media on a `voip-control`-only build with no
# injected backend is the typed `MediaSetupError::NoBackend`, never a panic or a silent no-op.
voip-control = ["wacore/voip-control"]
# The resident backend that implements `voip-control`'s traits on top of `wacore::voip`'s engine:
# spec validation, command dispatch, and stats publication. Events need no translation: the public
# event type is the engine's own event type under its seam name. This is the only media feature
# that turns `wacore/voip` on.
voip-engine-wacore = ["voip-control", "wacore/voip"]
# The native relay media transport: one UDP socket per call, DTLS, SCTP, and the pre-negotiated
# DataChannel over them. This is the half that cannot exist on wasm32 or espidf, so it is the half
# that is its own feature -- a page supplies its own `RelayTransportProvider` (an `RTCPeerConnection`
# reaches the same relay) through `Client::set_relay_transport_provider`, and needs none of this.
voip-relay-native = [
    "voip-runtime",
    "tokio-runtime",
    "tokio/net",
    "dep:rtc-dtls",
    "dep:rtc-sctp",
    "dep:rtc-datachannel",
    "dep:rtc-shared",
]
# Backwards-compatible full profile: preserves both codec adapters from the former single feature,
# and the native relay every consumer of `voip` has always been getting.
voip = ["voip-mlow", "voip-libopus", "voip-relay-native"]
# Codec-bypass profile: raw MLOW/Opus payloads supplied by the application, no codec linked.
voip-encoded = ["voip-runtime"]
# Explicit spelling for consumers that assemble feature sets instead of using `voip`.
voip-mlow = ["voip-runtime", "wacore/voip-mlow"]
# Optional PCM adapter for standard Opus, including MLOW's CELT escape. Encoded I/O needs no libopus.
voip-libopus = ["voip-encoded", "dep:opus"]

[dependencies]
anyhow = { version = "1.0", default-features = false }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
async-lock = { version = "3", default-features = false }
async-trait = { version = "0.1.91" }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bon = { version = "3.9.3", default-features = false, features = ["std"] }
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
bytes = { version = "1.12", default-features = false }
# `now` rather than `clock`: only `Utc::now()` is used, and `clock` exists to
# resolve the local timezone (pulling iana-time-zone and its per-OS backends).
chrono = { version = "0.4", default-features = false, features = ["now"] }
event-listener = { version = "5", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await", "std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
smallvec = { version = "1.15" }
hashbrown = { version = "0.17.1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
itoa = { version = "1" }
log = { version = "0.4" }
opus = { version = "0.4", optional = true }
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
rand = { version = "0.10" }
# The sans-IO media stack for `voip`. Pinned exactly: 0.21 is a pre-1.0 beta, so a minor bump
# may be breaking, and a `cargo update` that silently moved it would break a call at runtime rather
# than at compile time. Revisit the pin when 0.21.0 goes stable. `crypto-ring` (the default) rather
# than aws-lc-rs because `ring` is already compiled here for rustls, via the websocket transport and
# the HTTP client, so the media stack costs no new crypto crate.
rtc-datachannel = { version = "=0.21.0-beta.2", optional = true }
rtc-dtls = { version = "=0.21.0-beta.2", optional = true, default-features = false, features = [
    "crypto-ring",
] }
rtc-sctp = { version = "=0.21.0-beta.2", optional = true }
# The vocabulary crate of the three above: they take and return its `TransportProtocol` and `Error`
# in public signatures and none of them re-exports it, so a caller that has to name a transport
# protocol or tell a peer close apart from a corrupt datagram needs it directly. Adds no crate to
# the tree; it is already there under the other three.
rtc-shared = { version = "=0.21.0-beta.2", optional = true, default-features = false }
scopeguard = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0.19" }
tokio = { version = "1.53.1", default-features = false, optional = true, features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1", default-features = false, optional = true, features = ["attributes"] }
wacore = { default-features = false, version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
wacore-binary = { default-features = false, version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
wacore-noise = { version = "0.7.0", optional = true, git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
waproto = { version = "0.7.0", git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
whatsapp-rust-sqlite-storage = { version = "0.7.0", optional = true, default-features = false, git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
whatsapp-rust-tokio-transport = { version = "0.7.0", optional = true, git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
whatsapp-rust-ureq-http-client = { version = "0.7.0", optional = true, git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }

# wasm32-unknown-unknown has no default getrandom backend, so make the browser
# one available (the only valid choice there) to build the crate standalone:
# CI wasm guard + downstream consumers like whatsapp-rust-bridge. Gated to the
# unknown-unknown triple per getrandom's guidance so wasm32-wasi/emscripten keep
# their own backends and don't pull wasm-bindgen/js-sys. Backend is still
# selected via `--cfg getrandom_backend="wasm_js"` in RUSTFLAGS; no native effect.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { version = "0.6", features = ["futures"] }

[dev-dependencies]
aes = { version = "0.9.2" }
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
# The startup-retention test ages a pending-inbound row directly, since the
# backend trait exposes no UPDATE. Dev-only; the crate already links diesel
# through `whatsapp-rust-sqlite-storage` in production.
diesel = { version = "2.3.11", default-features = false, features = ["sqlite", "r2d2", "32-column-tables"] }
divan = { package = "codspeed-divan-compat", version = "=5.0.2" }
dhat = "0.3"
env_logger = { version = "0.11", default-features = false }
# URL parser for the benchmark example's mock admin endpoint derivation.
# Dev-only so production builds carry no new dependency; already in the tree
# via the Tokio transport, so this adds no new crate to compile.
http = "1"
# `total_listeners()` (how tests observe that a waiter parked) is std-gated.
event-listener = { version = "5", default-features = false, features = ["std"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
# Raises real SIGINT/SIGTERM at the current process in the shutdown-signal test.
libc = "0.2"
metrics-exporter-prometheus = "0.18"
# Parses the crate sources in tests/error_surface.rs. Text scanning silently
# missed error enums whose doc comments carried unbalanced braces.
syn = { version = "3.0", features = ["full"] }
tokio = { version = "1.53.1", default-features = false, features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
wacore = { default-features = false, version = "0.7.0", features = ["test-util"], git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }
wacore-noise = { features = ["test-util"], git = "https://github.com/oxidezap/whatsapp-rust", rev = "0dc38af07632f48f0cf6c66df285f1643fc22b95" }

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unused_qualifications = "warn"

# The demo client. Needs only the package default features, so a plain
# `cargo build --example demo` works without `required-features`.

[patch."https://github.com/oxidezap/whatsapp-rust"]
wacore = { path = "../wacore" }
