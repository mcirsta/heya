name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and runtime dependencies
        timeout-minutes: 15
        run: |
          # Hosted runners also select Azure through mirror+file sources. Rewrite
          # those mirror lists too; changing only .sources leaves Azure selected.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang libclang-dev cmake ninja-build pkg-config \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libgl1-mesa-dev libssl-dev libdbus-1-dev dbus \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            fonts-inter fonts-noto-color-emoji poppler-utils bubblewrap util-linux
      - name: Enable the PDF sandbox on the CI runner
        run: |
          # Allow only the installed bwrap executable to create user namespaces.
          # Heya's mount, network and resource restrictions still apply inside it.
          if [ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null)" = Y ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) { userns, }\n' | sudo apparmor_parser -r
          fi
          bwrap --unshare-all --die-with-parent --new-session \
            --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 \
            --proc /proc --dev /dev --size 67108864 --tmpfs /tmp \
            /usr/bin/pdftoppm -h
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-rust-1.99.1-${{ hashFiles('Cargo.lock', '.github/workflows/linux.yml') }}-${{ github.sha }}
          restore-keys: |
            linux-rust-1.99.1-${{ hashFiles('Cargo.lock', '.github/workflows/linux.yml') }}-
            linux-rust-1.99.1-
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint default Linux build
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Linux with GStreamer
        run: cargo test --locked
      - name: Check silent duplex call audio without devices or an account
        env:
          HEYA_TEST_CALL_GSTREAMER: '1'
        run: cargo test --locked --bin heya -- --ignored --exact call_audio::tests::native_gstreamer_duplex_audio --nocapture
      - name: Check camera codecs without devices or an account
        env:
          HEYA_TEST_CALL_VIDEO_NATIVE: '1'
        run: cargo test --locked --bin heya -- --ignored --exact call_video::tests::native_camera_codec_loopback --nocapture
      - name: Lint Linux without audio
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Test Linux without audio
        run: cargo test --locked --no-default-features
      - name: Save build progress
        if: always() && !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
